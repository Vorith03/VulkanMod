buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Forge loads production mods and libraries as named Java modules. Keep the
// LWJGL Vulkan binding as its own nested library module so LWJGL's GLFW module
// can resolve org.lwjgl.vulkan.VkInstance from the module it expects.
jarJar.enable()

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vulkanmod {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

configurations {
    shade
    implementation.extendsFrom shade
}

// Capture this outside Jar task closures so Groovy does not resolve `shade`
// against ForgeGradle's jarJar configuration/task delegate.
def shadeConfiguration = configurations.shade

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Temporary compile-only bridge for the one remaining @Environment annotation
    // in LiquidRenderer. This dependency is not shaded or required at runtime.
    compileOnly 'net.fabricmc:fabric-loader:0.14.21'

    // Forge 47.3.0 ships Mixin 0.8.5. The annotation processor generates the
    // production refmap used to remap Mojmap-named mixin targets after reobf.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Keep the Vulkan binding on the compile/dev runtime classpath. Packaging is
    // handled independently by Jar-in-Jar below, so this does not flatten its
    // classes into VulkanMod's outer JAR.
    implementation("org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}") {
        transitive = false
    }

    // GLFWVulkan is part of Minecraft's org.lwjgl.glfw module and directly
    // references org.lwjgl.vulkan types. Flattening lwjgl-vulkan into the mod
    // JAR hides those classes behind VulkanMod's module, causing VkInstance to
    // fail class resolution. Jar-in-Jar preserves lwjgl-vulkan as its own module.
    jarJar(group: 'org.lwjgl', name: 'lwjgl-vulkan', version: "[${project.lwjgl_version},3.3.2)") {
        jarJar.pin(it, project.lwjgl_version)
        transitive = false
    }

    // VMA and shaderc are only called from VulkanMod code, so they can remain
    // embedded in the mod JAR for now. Keep their transitive lwjgl-core out;
    // Minecraft already supplies the matching LWJGL 3.3.1 core module.
    shade("org.lwjgl:lwjgl-vma:${project.lwjgl_version}") { transitive = false }
    shade("org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}") { transitive = false }

    // Native libraries required by VMA/shaderc at runtime. Keep these
    // non-transitive for the same reason.
    shade("org.lwjgl:lwjgl-vma:${project.lwjgl_version}:natives-windows") { transitive = false }
    shade("org.lwjgl:lwjgl-vma:${project.lwjgl_version}:natives-linux") { transitive = false }
    shade("org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}:natives-windows") { transitive = false }
    shade("org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}:natives-linux") { transitive = false }
}

mixin {
    add sourceSets.main, 'vulkanmod.refmap.json'
    config 'vulkanmod.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : 'xCollateral / Vorith03 Forge port',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Vorith03',
                'MixinConfigs'            : 'vulkanmod.mixins.json'
        ])
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        shadeConfiguration.collect { it.isDirectory() ? it : zipTree(it) }
    }
    finalizedBy 'reobfJar'
}

// ForgeGradle 6's jarJar task does not inherit custom `from` inputs added to
// the plain jar task. Preserve VMA, shaderc, and their native resources in the
// distributable Jar-in-Jar archive while keeping lwjgl-vulkan nested.
tasks.named('jarJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        shadeConfiguration.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// A green build must validate the file that is actually distributed, not just
// that Java compiled. This catches the exact classes of packaging failures that
// previously only appeared after installing the mod in Prism.
tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Verifies the Forge runtime JAR, JarJar metadata, native payload, and LWJGL module linkage.'
    dependsOn 'reobfJarJar'

    doLast {
        File dist = tasks.named('jarJar').get().archiveFile.get().asFile
        if (!dist.isFile()) {
            throw new GradleException("Distributable JarJar artifact was not produced: ${dist}")
        }

        File nestedVulkan
        java.util.jar.JarFile outer = new java.util.jar.JarFile(dist)
        try {
            Set<String> entries = outer.entries().collect { it.name } as Set<String>
            List<String> requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/mods.toml',
                    'META-INF/accesstransformer.cfg',
                    'META-INF/jarjar/metadata.json',
                    "META-INF/jarjar/lwjgl-vulkan-${project.lwjgl_version}.jar",
                    'vulkanmod.mixins.json',
                    'vulkanmod.refmap.json',
                    'net/vulkanmod/Initializer.class',
                    'net/vulkanmod/mixin/MixinPlugin.class',
                    'net/vulkanmod/mixin/WindowMixin.class',
                    'net/vulkanmod/mixin/render/RenderSystemMixin.class',
                    'org/lwjgl/util/vma/Vma.class',
                    'org/lwjgl/util/shaderc/Shaderc.class',
                    'linux/x64/org/lwjgl/vma/liblwjgl_vma.so',
                    'linux/x64/org/lwjgl/shaderc/libshaderc.so',
                    'windows/x64/org/lwjgl/vma/lwjgl_vma.dll',
                    'windows/x64/org/lwjgl/shaderc/shaderc.dll'
            ]

            requiredEntries.each { String entry ->
                if (!entries.contains(entry)) {
                    throw new GradleException("Distributable is missing required runtime entry: ${entry}")
                }
            }

            if (entries.any { it.startsWith('org/lwjgl/vulkan/') }) {
                throw new GradleException('lwjgl-vulkan classes were flattened into the outer mod JAR; they must remain a nested module')
            }

            String mixinConfigs = outer.manifest?.mainAttributes?.getValue('MixinConfigs')
            if (mixinConfigs != 'vulkanmod.mixins.json') {
                throw new GradleException("Missing/incorrect MixinConfigs manifest attribute: ${mixinConfigs}")
            }

            String modsToml = outer.getInputStream(outer.getJarEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!modsToml.contains('modId="vulkanmod"') || !modsToml.contains("version=\"${project.mod_version}\"")) {
                throw new GradleException('mods.toml was not expanded with the expected VulkanMod id/version')
            }
            if (modsToml.contains('${')) {
                throw new GradleException('mods.toml still contains unexpanded Gradle placeholders')
            }

            String jarJarMetadata = outer.getInputStream(outer.getJarEntry('META-INF/jarjar/metadata.json')).getText('UTF-8')
            if (!jarJarMetadata.contains('"artifact": "lwjgl-vulkan"') ||
                    !jarJarMetadata.contains("\"artifactVersion\": \"${project.lwjgl_version}\"")) {
                throw new GradleException('JarJar metadata does not describe the pinned lwjgl-vulkan runtime dependency')
            }

            def nestedEntry = outer.getJarEntry("META-INF/jarjar/lwjgl-vulkan-${project.lwjgl_version}.jar")
            nestedVulkan = new File(temporaryDir, "lwjgl-vulkan-${project.lwjgl_version}.jar")
            nestedVulkan.bytes = outer.getInputStream(nestedEntry).bytes
        } finally {
            outer.close()
        }

        java.util.jar.JarFile nested = new java.util.jar.JarFile(nestedVulkan)
        try {
            if (nested.getJarEntry('org/lwjgl/vulkan/VkInstance.class') == null) {
                throw new GradleException('Nested lwjgl-vulkan JAR does not contain VkInstance')
            }
            if (nested.getJarEntry('META-INF/versions/9/module-info.class') == null) {
                throw new GradleException('Nested lwjgl-vulkan JAR is missing its Java 9 module descriptor')
            }
        } finally {
            nested.close()
        }

        def vulkanModule = java.lang.module.ModuleFinder.of(nestedVulkan.toPath()).find('org.lwjgl.vulkan')
        if (!vulkanModule.isPresent()) {
            throw new GradleException('Nested lwjgl-vulkan JAR is not discoverable as module org.lwjgl.vulkan')
        }

        // Recreate the critical JPMS link that previously crashed at runtime:
        // org.lwjgl.glfw.GLFWVulkan must be able to resolve VkInstance from the
        // standalone org.lwjgl.vulkan module.
        Set<File> runtimeFiles = configurations.runtimeClasspath.files
        File lwjglCore = runtimeFiles.find { it.name == "lwjgl-${project.lwjgl_version}.jar" }
        File lwjglGlfw = runtimeFiles.find { it.name == "lwjgl-glfw-${project.lwjgl_version}.jar" }
        if (lwjglCore == null || lwjglGlfw == null) {
            throw new GradleException('Could not locate Minecraft LWJGL core/GLFW jars for module linkage verification')
        }

        def finder = java.lang.module.ModuleFinder.of(lwjglCore.toPath(), lwjglGlfw.toPath(), nestedVulkan.toPath())
        Set<String> roots = ['org.lwjgl', 'org.lwjgl.glfw', 'org.lwjgl.vulkan'] as Set<String>
        def configuration = java.lang.ModuleLayer.boot().configuration().resolve(
                finder,
                java.lang.module.ModuleFinder.of(),
                roots
        )
        def layer = java.lang.ModuleLayer.boot().defineModulesWithOneLoader(configuration, ClassLoader.getSystemClassLoader())
        Class<?> glfwVulkan = Class.forName('org.lwjgl.glfw.GLFWVulkan', false, layer.findLoader('org.lwjgl.glfw'))
        Class<?> vkInstance = Class.forName('org.lwjgl.vulkan.VkInstance', false, layer.findLoader('org.lwjgl.vulkan'))

        // Force JVM resolution of method signature types without calling GLFW or
        // touching a native Vulkan driver.
        glfwVulkan.declaredMethods.each { method ->
            method.parameterTypes
            method.returnType
        }
        if (!glfwVulkan.module.canRead(vkInstance.module)) {
            throw new GradleException('org.lwjgl.glfw cannot read org.lwjgl.vulkan in the verified module layer')
        }

        logger.lifecycle("Verified distributable: ${dist.name}")
        logger.lifecycle('Verified nested LWJGL module linkage: org.lwjgl.glfw -> org.lwjgl.vulkan')
    }
}

tasks.named('check').configure {
    dependsOn 'verifyDistribution'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
}
