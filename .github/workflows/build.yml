name: build

on:
  push:
    branches: [forge-1.20.1]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build and verify distributable
        run: ./gradlew build --stacktrace
      - name: Install software Vulkan smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers
      - name: Smoke-test Forge client Vulkan startup
        shell: bash
        run: |
          set -euo pipefail
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$LVP_ICD" ]]; then
            echo "Lavapipe Vulkan ICD was not installed" >&2
            exit 1
          fi
          echo "Using software Vulkan ICD: $LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"
          export LIBGL_ALWAYS_SOFTWARE=1
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dvulkanmod.smokeTest=true"
          timeout 240s xvfb-run -a ./gradlew runClient --stacktrace 2>&1 | tee vulkan-smoke.log
          grep -F "Vulkan smoke test passed" vulkan-smoke.log
          grep -F "Liquid vertex alpha/UV smoke test passed" vulkan-smoke.log
      - name: Smoke-test Forge client Vulkan startup without early splash
        shell: bash
        run: |
          set -euo pipefail
          test -f run/config/fml.toml
          sed -i 's/^earlyWindowControl = true$/earlyWindowControl = false/' run/config/fml.toml
          grep -F 'earlyWindowControl = false' run/config/fml.toml

          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$LVP_ICD" ]]; then
            echo "Lavapipe Vulkan ICD was not installed" >&2
            exit 1
          fi
          echo "Using software Vulkan ICD: $LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"
          export LIBGL_ALWAYS_SOFTWARE=1
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dvulkanmod.smokeTest=true"
          timeout 240s xvfb-run -a ./gradlew runClient --stacktrace 2>&1 | tee vulkan-smoke-no-splash.log
          grep -F "ImmediateWindowProvider not loading because splash screen is disabled" vulkan-smoke-no-splash.log
          grep -F "Created Vulkan NO_API window without Forge early splash context" vulkan-smoke-no-splash.log
          grep -F "Vulkan smoke test passed" vulkan-smoke-no-splash.log
          grep -F "Liquid vertex alpha/UV smoke test passed" vulkan-smoke-no-splash.log
      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Forge-smoke-log
          path: |
            vulkan-smoke.log
            vulkan-smoke-no-splash.log
          if-no-files-found: ignore
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Forge-build
          path: build/libs/
          if-no-files-found: ignore
