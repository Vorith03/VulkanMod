name: build

on:
  push:
    branches: [forge-1.20.1]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PRIVATE_PACK_TOKEN_CONFIGURED: ${{ secrets.VULKANMOD_PRIVATE_PACK_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Stamp CI build version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ -z "$base_version" ]]; then
            echo "Could not read mod_version from gradle.properties" >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA::8}"
          ci_version="${base_version}-build.${GITHUB_RUN_NUMBER}-g${short_sha}"
          sed -i "s/^mod_version=.*/mod_version=${ci_version}/" gradle.properties
          echo "CI mod version: ${ci_version}"
          echo "Expected distributable: VulkanMod_Forge_1.20.1-${ci_version}-all.jar"
      - name: Validate smoke fixture isolation
        run: bash scripts/ci/vulkan-smoke-fixture-contract.sh
      - name: Build and verify distributable
        run: ./gradlew build --stacktrace
      - name: Install software Vulkan smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers vulkan-validationlayers
      - name: Smoke-test Forge client Vulkan startup
        run: bash scripts/ci/vulkan-smoke.sh startup
      - name: Smoke-test Forge client Vulkan startup without early splash
        run: bash scripts/ci/vulkan-smoke.sh no-splash
      - name: Smoke-test persistent GPU indirect shadow commands
        run: bash scripts/ci/vulkan-smoke.sh gpu-indirect-shadow
      - name: Smoke-test vanilla Vulkan post-chain execution
        run: bash scripts/ci/vulkan-smoke.sh post-chain
      - name: Smoke-test vanilla Vulkan depth post-chain execution
        run: bash scripts/ci/vulkan-smoke.sh depth-post-chain
      - name: Smoke-test Vulkan screenshot readback
        run: bash scripts/ci/vulkan-smoke.sh screenshot
      - name: Smoke-test FTB Library 2001.2.13 scissor compatibility
        run: bash scripts/ci/ftb-library-smoke.sh
      - name: Smoke-test Pick Up Notifier 8.0.0 compatibility
        run: bash scripts/ci/pickup-notifier-smoke.sh
      - name: Smoke-test Immersive Portals 3.0.7 compatibility
        run: bash scripts/ci/immersive-portals-smoke.sh
      - name: Check private resource pack fixture configuration
        if: github.event_name == 'push' && ((vars.VULKANMOD_PRIVATE_PACK_REPO != '') != (env.PRIVATE_PACK_TOKEN_CONFIGURED == 'true'))
        run: |
          echo 'Configure both VULKANMOD_PRIVATE_PACK_REPO (variable) and VULKANMOD_PRIVATE_PACK_TOKEN (secret), or neither.' >&2
          exit 1
      - name: Download private resource pack fixtures
        if: github.event_name == 'push' && vars.VULKANMOD_PRIVATE_PACK_REPO != '' && env.PRIVATE_PACK_TOKEN_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ secrets.VULKANMOD_PRIVATE_PACK_TOKEN }}
          PRIVATE_PACK_REPO: ${{ vars.VULKANMOD_PRIVATE_PACK_REPO }}
        run: |
          mkdir -p .ci-private-packs
          gh release download test-packs --repo "$PRIVATE_PACK_REPO" \
            --pattern base.zip --pattern overlay.zip --dir .ci-private-packs
      - name: Smoke-test both real resource packs
        if: github.event_name == 'push' && vars.VULKANMOD_PRIVATE_PACK_REPO != '' && env.PRIVATE_PACK_TOKEN_CONFIGURED == 'true'
        env:
          VULKANMOD_REAL_BASE_PACK: .ci-private-packs/base.zip
          VULKANMOD_REAL_OVERLAY_PACK: .ci-private-packs/overlay.zip
        run: bash scripts/ci/immersive-portals-smoke.sh
      - name: Smoke-test Distant Horizons 3.2.0-b compatibility
        run: bash scripts/ci/distant-horizons-smoke.sh
      - name: Smoke-test Crash Assistant 1.9.7 compatibility
        run: bash scripts/ci/vulkan-smoke.sh crash-assistant
      - name: Smoke-test Chat Heads 0.13.18 compatibility
        run: bash scripts/ci/vulkan-smoke.sh chat-heads
      - name: Smoke-test Flywheel 0.6 compatibility
        run: bash scripts/ci/vulkan-smoke.sh flywheel
      - name: Smoke-test Create 0.5.1.j stencil compatibility
        run: bash scripts/ci/vulkan-smoke.sh create
      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Forge-smoke-log-${{ github.run_number }}
          path: |
            vulkan-smoke.log
            vulkan-smoke-no-splash.log
            vulkan-gpu-indirect-shadow-smoke.log
            vulkan-post-chain-smoke.log
            vulkan-depth-post-chain-smoke.log
            vulkan-screenshot-smoke.log
            vulkan-smoke-ftb-library.log
            vulkan-smoke-pickup-notifier.log
            vulkan-smoke-immersive-portals.log
            vulkan-smoke-distant-horizons.log
            run/screenshot-smoke/screenshots/*.png
            vulkan-smoke-crash-assistant.log
            vulkan-smoke-chat-heads.log
            vulkan-smoke-flywheel.log
            vulkan-smoke-create.log
          if-no-files-found: ignore
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Forge-build-${{ github.run_number }}
          path: build/libs/*-all.jar
          if-no-files-found: ignore
